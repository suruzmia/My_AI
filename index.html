<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Web Mini App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-robot"></i> My AI
            </div>
            <nav class="menu">
                <button class="menu-btn active" data-mode="chat"><i class="fa-solid fa-comments"></i> 🤖 AI Chat</button>
                <button class="menu-btn" data-mode="image-gen"><i class="fa-solid fa-palette"></i> 🎨 AI Image Generator</button>
                <button class="menu-btn" data-mode="image-analysis"><i class="fa-solid fa-image"></i> 🖼️ Image Analysis</button>
                <button class="menu-btn" data-mode="pdf-analysis"><i class="fa-solid fa-file-pdf"></i> 📄 PDF Analysis</button>
                <button class="menu-btn" data-mode="coding"><i class="fa-solid fa-code"></i> 💻 Coding Assistant</button>
                <button class="menu-btn" data-mode="translate"><i class="fa-solid fa-language"></i> 🌐 Translator</button>
            </nav>
            <div class="sidebar-footer">
                <!-- Monetization Shortener / Support Button -->
                <a href="https://your-link.com" target="_blank" class="support-btn">
                    <i class="fa-solid fa-heart"></i> Support Developer
                </a>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="chat-workspace">
            <header class="workspace-header">
                <h2 id="current-mode-title">🤖 AI Chat</h2>
                <button id="clear-chat-btn" title="Clear Memory"><i class="fa-solid fa-trash"></i> Clear Memory</button>
            </header>

            <div class="chat-box" id="chat-box">
                <div class="message ai-message">
                    Hello! I am **My AI**. How can I assist you today?
                </div>
            </div>

            <!-- Preview File Tag -->
            <div id="file-tag-container"></div>

            <!-- Input Controls -->
            <div class="input-container">
                <input type="file" id="file-input" style="display: none;" accept="image/*,.pdf">
                <button class="icon-btn" id="attach-btn" title="Attach Image/PDF">
                    <i class="fa-solid fa-paperclip"></i>
                </button>
                <button class="icon-btn" id="voice-btn" title="Voice Input">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                <textarea id="user-input" placeholder="Type a message or prompt..." rows="1"></textarea>
                <button id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </main>
    </div>

    <!-- External Markdown and Syntax Highlighting Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
